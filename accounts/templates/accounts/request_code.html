{% extends "base.html" %}
{% block title %}Sign in · HICC Choir Ops{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="card">
    <h1 class="page-title">Sign in</h1>
    <p class="muted mt-2">We'll email you a 6-digit code. There's no password.</p>
    <form method="post" class="mt-6 space-y-6">
      {% csrf_token %}
      {% include "components/_field.html" with field=form.email %}
      {% if error %}<p role="alert" class="alert-error font-medium">{{ error }}</p>{% endif %}
      <button type="submit" class="btn-primary">Email me a code</button>
    </form>
  </div>
</div>
{% endblock %}
