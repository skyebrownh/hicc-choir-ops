{% extends "base.html" %}
{% load static %}
{% block title %}Members · HICC Choir Ops{% endblock %}
{% block content %}
<div class="flex items-center justify-between gap-4">
  <h1 class="page-title">Members</h1>
  {% if user.is_admin %}
  <a href="{% url 'member-add' %}" class="btn-primary w-auto shrink-0">Add member</a>
  {% endif %}
</div>
{# RO-4: GET, so a filtered list has its own URL. The script submits it on change; <noscript> keeps it usable without JavaScript. #}
<form method="get" id="member-filters" class="mt-4 grid gap-4 sm:grid-cols-3">
  {% for field in filters %}
  <div>
    <label for="{{ field.id_for_label }}" class="label">{{ field.label }}</label>
    <div class="mt-1 grid grid-cols-1">{{ field }}{% include "components/_select_chevron.html" %}</div>
  </div>
  {% endfor %}
  <noscript><button type="submit" class="btn-primary">Apply</button></noscript>
</form>
{% if filters.changed_from_default %}
<a href="{% url 'member-list' %}" class="link">Reset</a>
{% endif %}
<script src="{% static 'members-filter.js' %}" defer></script>
{# RO-4: said out loud so nobody wonders where the Inactive members went. #}
{% if filters.hiding_inactive %}
<p class="empty-state mt-4">Showing Active and On Break members. Inactive members are hidden.
  <a href="{% url 'member-list' %}?{{ filters.everyone_query }}" class="link">Show everyone</a></p>
{% endif %}
{% if has_members %}
{% for group in groups %}
<h2 class="mt-6 font-semibold text-gray-900">{{ group.label }}</h2>
<ul class="mt-2 divide-y divide-gray-200 overflow-hidden rounded-lg bg-white shadow-sm">
  {% for member in group.members %}
  <li>
    <a href="{% url 'member-detail' member.pk %}" class="flex min-h-14 items-center justify-between gap-3 px-4 py-3 hover:bg-gray-50">
      <span class="font-medium text-gray-900">{{ member.name }}</span>
      <span class="flex flex-wrap justify-end gap-2">
        {% if member.praise_team_now %}<span class="badge-accent">Praise Team</span>{% endif %}
        {# RO-2: current status. The section is the heading above, so it isn't repeated. #}
        {% if member.status_label %}<span class="badge">{{ member.status_label }}</span>{% endif %}
      </span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endfor %}
{% else %}
{% if filters.changed_from_default %}
<p class="empty-state mt-6">No members match these filters.</p>
{% else %}
<p class="empty-state mt-6">No members to show.</p>
{% endif %}
{% endif %}
{% endblock %}
