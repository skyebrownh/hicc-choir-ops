{# AT-1, AT-3: events under a heading for each month. Pass `months` (from the view) and, for the Events page, `clickable`. #}
{% for month, events in months %}
<h2 class="mt-6 font-semibold text-gray-900">{{ month }}</h2>
<ul class="mt-2 divide-y divide-gray-200 overflow-hidden rounded-lg bg-white shadow-sm">
  {% for event in events %}{% include "roster/_event_row.html" %}{% endfor %}
</ul>
{% endfor %}
